version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 10
    ignore:
      # Astro check requires the programmatic compiler API that TypeScript 7 does not expose yet.
      - dependency-name: 'typescript'
        versions:
          - '>=7.0.0'
    groups:
      # Minor and patch updates are grouped and auto-merged
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      # Major updates are separate for manual review
      major:
        patterns:
          - '*'
        update-types:
          - 'major'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      actions-major:
        patterns:
          - '*'
        update-types:
          - 'major'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(deps)'
